name: Demo GIFs

# Re-records docs/assets/*.gif from docs/tapes/*.tape with the freshly built
# eta, in one job so the toolchain is set up once. Every tape uses a keyless
# city, so no secrets are needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/tapes/**"
      - "cmd/**"
      - "internal/**"

permissions:
  contents: write

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install eta and zsh (the tapes' shell)
        run: |
          go install ./cmd/eta
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Live APIs reachable
        run: eta cities --check
      - name: Install VHS
        uses: charmbracelet/vhs-action@v2
        with:
          install-fonts: true
          path: docs/tapes/overview.tape
      - name: Record the tapes
        run: |
          for tape in board route list pick watch json alias; do
            echo "== $tape"
            vhs "docs/tapes/$tape.tape"
          done
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(demo): re-record gifs"
          file_pattern: docs/assets/*.gif
