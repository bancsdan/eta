name: Demo GIFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/tapes/**"
      - "cmd/**"
      - "internal/**"

permissions:
  contents: write

jobs:
  check:
    name: Live APIs reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run ./cmd/eta cities --check

  record:
    name: Record ${{ matrix.tape }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tape: [overview, board, route, list, pick, watch, json, alias]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install eta and zsh (the tapes' shell)
        run: |
          go install ./cmd/eta
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update -q && sudo apt-get install -y -q zsh
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/tapes/${{ matrix.tape }}.tape
      - uses: actions/upload-artifact@v4
        with:
          name: gif-${{ matrix.tape }}
          path: docs/assets/${{ matrix.tape }}.gif
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit gifs
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gif-*
          path: docs/assets
          merge-multiple: true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(demo): re-record gifs"
          file_pattern: docs/assets/*.gif
